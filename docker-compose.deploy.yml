services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    restart: unless-stopped

  migrate:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE before deploy}
    environment: &backend_env
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-100}
      REDIS_SOCKET_CONNECT_TIMEOUT: ${REDIS_SOCKET_CONNECT_TIMEOUT:-2.0}
      REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT:-2.0}
      KAFKA_ENABLED: ${KAFKA_ENABLED:?Set KAFKA_ENABLED}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:?Set KAFKA_CLIENT_ID}
      KAFKA_TOPIC_FAVORITE: ${KAFKA_TOPIC_FAVORITE:?Set KAFKA_TOPIC_FAVORITE}
      KAFKA_TOPIC_RATING: ${KAFKA_TOPIC_RATING:?Set KAFKA_TOPIC_RATING}
      KAFKA_TOPIC_DESTINATION: ${KAFKA_TOPIC_DESTINATION:?Set KAFKA_TOPIC_DESTINATION}
      KAFKA_TOPIC_VIEW: ${KAFKA_TOPIC_VIEW:?Set KAFKA_TOPIC_VIEW}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:?Set KAFKA_DLQ_TOPIC}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:?Set KAFKA_CONSUMER_GROUP}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:?Set ELASTICSEARCH_ENABLED}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:?Set ELASTICSEARCH_URL}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:?Set ELASTICSEARCH_INDEX}
      SEARCH_USE_ELASTICSEARCH: ${SEARCH_USE_ELASTICSEARCH:?Set SEARCH_USE_ELASTICSEARCH}
      WORKER_RETRY_MAX: ${WORKER_RETRY_MAX:-3}
      WORKER_RETRY_BACKOFF_SECONDS: ${WORKER_RETRY_BACKOFF_SECONDS:-0.5}
      DESTINATION_IMAGE_CLOUDINARY_ENABLED: ${DESTINATION_IMAGE_CLOUDINARY_ENABLED:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_UPLOAD_FOLDER: ${CLOUDINARY_UPLOAD_FOLDER:-travel/destinations}
      DESTINATION_IMAGE_TIMEOUT_SECONDS: ${DESTINATION_IMAGE_TIMEOUT_SECONDS:-8.0}
      DESTINATION_IMAGE_MAX_BYTES: ${DESTINATION_IMAGE_MAX_BYTES:-8000000}
      DESTINATION_IMAGE_UPLOAD_CONCURRENCY: ${DESTINATION_IMAGE_UPLOAD_CONCURRENCY:-3}
      DESTINATION_IMAGE_BACKFILL_BATCH_SIZE: ${DESTINATION_IMAGE_BACKFILL_BATCH_SIZE:-50}
      DESTINATION_IMAGE_BACKFILL_SLEEP_SECONDS: ${DESTINATION_IMAGE_BACKFILL_SLEEP_SECONDS:-0.0}
      DESTINATION_IMAGE_BACKFILL_CHECKPOINT_FILE: ${DESTINATION_IMAGE_BACKFILL_CHECKPOINT_FILE:-./.runtime/destination_image_backfill_checkpoint.json}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      SERVICE_PROFILE: ${SERVICE_PROFILE:-monolith}
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "sh",
        "-lc",
        "alembic upgrade head && if [ \"$RUN_SEED\" = \"true\" ]; then python scripts/seed.py; else echo 'RUN_SEED=false, skip seed'; fi",
      ]
    restart: "no"

  auth-service:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE before deploy}
    environment:
      <<: *backend_env
      SERVICE_PROFILE: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.apps.auth_service:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  destination-service:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE before deploy}
    environment:
      <<: *backend_env
      SERVICE_PROFILE: destination-service
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.apps.destination_service:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  interaction-service:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE before deploy}
    environment:
      <<: *backend_env
      SERVICE_PROFILE: interaction-service
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.apps.interaction_service:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  admin-service:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE before deploy}
    environment:
      <<: *backend_env
      SERVICE_PROFILE: admin-service
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.apps.admin_service:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  analytics-service:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE before deploy}
    environment:
      <<: *backend_env
      SERVICE_PROFILE: analytics-service
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started
    command: ["uvicorn", "app.apps.analytics_service:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  worker-service:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE before deploy}
    environment:
      <<: *backend_env
      SERVICE_PROFILE: worker-service
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started
    command: ["python", "-m", "app.worker.consumer"]
    restart: unless-stopped

  api-gateway:
    image: ${GATEWAY_IMAGE:?Set GATEWAY_IMAGE before deploy}
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - destination-service
      - interaction-service
      - admin-service
      - analytics-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
