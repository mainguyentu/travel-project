name-template: v$NEXT_PATCH_VERSION
tag-template: v$NEXT_PATCH_VERSION
change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '<*_&'

categories:
  - title: Features
    labels:
      - feature
      - enhancement
  - title: Fixes
    labels:
      - bug
      - fix
  - title: CI/CD
    labels:
      - ci
      - cd
      - devops
  - title: Security
    labels:
      - security

exclude-labels:
  - skip-changelog

template: |
  ## Summary
  $CHANGES

  ## Full Changelog
  $CONTRIBUTORS
