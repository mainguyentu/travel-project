name: release-build

on:
  push:
    tags: ["v*"]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/travel-backend:${{ github.ref_name }}
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/travel-frontend:${{ github.ref_name }}
      - name: Build gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/travel-gateway:${{ github.ref_name }}
      - name: Trivy image scan (advisory)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/travel-backend:${{ github.ref_name }}
          severity: HIGH,CRITICAL
