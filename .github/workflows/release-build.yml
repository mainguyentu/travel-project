name: Release Build

on:
  workflow_run:
    workflows:
      - Repo Quality
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional explicit image tag (defaults to git SHA)
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${{ github.event.inputs.image_tag || '' }}" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository }}/backend:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api-gateway:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository }}/api-gateway:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish build summary
        run: |
          {
            echo "## Release Build"
            echo ""
            echo "- Backend image: ghcr.io/${{ github.repository }}/backend:${{ steps.tag.outputs.value }}"
            echo "- API gateway image: ghcr.io/${{ github.repository }}/api-gateway:${{ steps.tag.outputs.value }}"
          } >> "$GITHUB_STEP_SUMMARY"
