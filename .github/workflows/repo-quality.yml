name: Repo Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests with coverage gate
        run: |
          pytest tests -q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=70

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Backend dependency scan (pip-audit)
        run: |
          mkdir -p security-reports
          pip-audit -r backend/requirements.txt -f json -o security-reports/pip-audit.json || true

      - name: Install frontend dependencies for scan
        working-directory: frontend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Frontend dependency scan (Composer)
        run: |
          composer audit --working-dir=frontend --format=json > security-reports/composer-audit.json || true

      - name: Frontend dependency scan (npm)
        working-directory: frontend
        run: |
          npm audit --json > ../security-reports/npm-audit.json

      - name: Build backend image for scan
        run: docker build -t travel-project-backend-ci:latest ./backend

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: travel-project-backend-ci:latest
          format: sarif
          output: security-reports/trivy-backend-image.sarif
          severity: HIGH,CRITICAL

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports

      - name: Upload Trivy SARIF
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-reports/trivy-backend-image.sarif

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend assets dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install frontend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Run frontend feature tests with coverage
        run: |
          mkdir -p build/logs
          vendor/bin/phpunit --list-tests
          vendor/bin/phpunit --configuration phpunit.xml --coverage-clover build/logs/clover.xml

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/build/logs/clover.xml
