name: repo-quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: travel
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d travel"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Migrate + test
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/travel
          REDIS_URL: redis://localhost:6379/0
          ES_ENABLED: "false"
          EVENTS_ENABLED: "false"
          INTERNAL_API_KEY: ci-internal-key
        run: |
          cd backend
          alembic upgrade head
          python scripts/seed.py
          python scripts/seed_catalog.py
          python -m pytest tests/ -q
      - name: pip-audit (advisory — lên blocking khi hết CVE HIGH chưa fix, U4)
        run: python -m pip_audit -r backend/requirements.txt || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Install + test (blocking, U4)
        run: |
          cd frontend
          composer install --no-interaction
          cp .env.example .env
          php artisan key:generate
          php vendor/bin/phpunit

  compose-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose (blocking, U4)
        run: docker compose config
