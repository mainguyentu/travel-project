name: deploy-production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.2.0)
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (template, approval via environment reviewers)
        run: |
          echo "Deploy tag ${{ inputs.tag }} to production (template)."
          echo "Rollback: re-run with previous tag."

  slo:
    needs: deploy
    uses: ./.github/workflows/post-deploy-slo-check.yml
    with:
      environment_name: production
    secrets:
      base_url: ${{ secrets.PROD_BASE_URL }}
