name: Deploy Production

on:
  workflow_run:
    workflows:
      - Release Build
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Release image tag (usually a git SHA)
        required: true
        type: string
      rollback_to_tag:
        description: Optional rollback tag. If set, deployment uses this tag instead of image_tag.
        required: false
        type: string
      confirm_phrase:
        description: Type DEPLOY_PRODUCTION to confirm manual deployment.
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_REPO: ghcr.io/${{ github.repository }}

jobs:
  skip-without-deploy-tag:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && !contains(github.event.workflow_run.head_commit.message, '[deploy]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip reason
        run: |
          {
            echo "## Production deployment skipped"
            echo ""
            echo "- Reason: Commit message does not contain [deploy]"
            echo "- Commit: ${{ github.event.workflow_run.head_sha }}"
            echo "- Message: ${{ github.event.workflow_run.head_commit.message }}"
          } >> "$GITHUB_STEP_SUMMARY"

  resolve-tag:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && contains(github.event.workflow_run.head_commit.message, '[deploy]')) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - name: Resolve deploy or rollback tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "image_tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "mode=deploy" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event.inputs.confirm_phrase }}" != "DEPLOY_PRODUCTION" ]]; then
            echo "Manual confirmation failed. Expected confirm_phrase=DEPLOY_PRODUCTION"
            exit 1
          fi

          if [[ -n "${{ github.event.inputs.rollback_to_tag || '' }}" ]]; then
            echo "image_tag=${{ github.event.inputs.rollback_to_tag }}" >> "$GITHUB_OUTPUT"
            echo "mode=rollback" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "mode=deploy" >> "$GITHUB_OUTPUT"
          fi

  manual-confirm:
    runs-on: ubuntu-latest
    needs: resolve-tag
    steps:
      - name: Wait for manual approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.repository_owner }}
          minimum-approvals: 1
          issue-title: "Approve production ${{ needs.resolve-tag.outputs.mode }}"
          issue-body: |
            Please approve this production ${{ needs.resolve-tag.outputs.mode }}.

            - Image tag: ${{ needs.resolve-tag.outputs.image_tag }}
            - Trigger: ${{ github.event_name }}
            - Commit message gate ([deploy]) is required for auto flow.

  deploy:
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - manual-confirm

    steps:
      - name: Remote deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.resolve-tag.outputs.image_tag }}
          DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_REPO: ${{ env.DEPLOY_REPO }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          envs: IMAGE_TAG,DEPLOY_PATH,GHCR_USERNAME,GHCR_TOKEN,DEPLOY_REPO
          script_stop: true
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            export BACKEND_IMAGE="$DEPLOY_REPO/backend:$IMAGE_TAG"
            export GATEWAY_IMAGE="$DEPLOY_REPO/api-gateway:$IMAGE_TAG"

            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            docker image prune -f

            docker compose -f docker-compose.deploy.yml ps

      - name: Deployment summary
        run: |
          {
            echo "## Production ${{ needs.resolve-tag.outputs.mode }}"
            echo ""
            echo "- Mode: ${{ needs.resolve-tag.outputs.mode }}"
            echo "- Tag: ${{ needs.resolve-tag.outputs.image_tag }}"
            echo "- Backend image: ${DEPLOY_REPO}/backend:${{ needs.resolve-tag.outputs.image_tag }}"
            echo "- API gateway image: ${DEPLOY_REPO}/api-gateway:${{ needs.resolve-tag.outputs.image_tag }}"
          } >> "$GITHUB_STEP_SUMMARY"

  post-deploy-slo:
    needs:
      - resolve-tag
      - deploy
    uses: ./.github/workflows/post-deploy-slo-check.yml
    with:
      environment_name: production
      health_latency_ms: 300
      read_latency_ms: 500
      analytics_latency_ms: 800
    secrets:
      base_url: ${{ secrets.PROD_BASE_URL }}
