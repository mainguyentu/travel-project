name: deploy-staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (e.g. v1.2.0)
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Smoke template (wire host via secrets in real env)
        run: |
          echo "Deploy tag ${{ inputs.tag }} to staging (template)."
          echo "Real step: ssh/scp compose bundle + 'docker compose pull && up -d'."

  slo:
    needs: deploy
    uses: ./.github/workflows/post-deploy-slo-check.yml
    with:
      environment_name: staging
    secrets:
      base_url: ${{ secrets.STAGING_BASE_URL }}
