worker_processes 1;

events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = / {
            return 200 "API Gateway is running";
        }

        location /health {
            proxy_pass http://destination-service:8000/health;
        }

        # Auth
        location = /api/v1/auth/ { return 301 /api/v1/auth; }
        location /api/v1/auth {
            proxy_pass http://auth-service:8000;
        }

        # Public
        location = /api/v1/public/ { return 301 /api/v1/public; }
        location /api/v1/public {
            proxy_pass http://destination-service:8000;
        }

        # Destinations
        location = /api/v1/destinations/ { return 301 /api/v1/destinations; }
        location /api/v1/destinations {
            proxy_pass http://destination-service:8000;
        }

        # Interaction
        location = /api/v1/me/ { return 301 /api/v1/me; }
        location /api/v1/me {
            proxy_pass http://interaction-service:8000;
        }

        # Admin
        location = /api/v1/admin/ { return 301 /api/v1/admin; }
        location /api/v1/admin {
            proxy_pass http://admin-service:8000;
        }
    }
}
