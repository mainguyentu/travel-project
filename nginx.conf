worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    map $request_uri $content_security_policy {
        default "default-src 'none'; frame-ancestors 'none'";
        ~^/api-docs/?$ "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fastapi.tiangolo.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fastapi.tiangolo.com https://fonts.googleapis.com; img-src 'self' data: https://cdn.jsdelivr.net https://fastapi.tiangolo.com; font-src 'self' data: https://cdn.jsdelivr.net https://fastapi.tiangolo.com https://fonts.gstatic.com; connect-src 'self' https://cdn.jsdelivr.net https://fastapi.tiangolo.com https://fonts.googleapis.com https://fonts.gstatic.com; base-uri 'self'; frame-ancestors 'none'";
        ~^/api-docs/(swagger|redoc)/ "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fastapi.tiangolo.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fastapi.tiangolo.com https://fonts.googleapis.com; img-src 'self' data: https://cdn.jsdelivr.net https://fastapi.tiangolo.com; font-src 'self' data: https://cdn.jsdelivr.net https://fastapi.tiangolo.com https://fonts.gstatic.com; connect-src 'self' https://cdn.jsdelivr.net https://fastapi.tiangolo.com https://fonts.googleapis.com https://fonts.gstatic.com; base-uri 'self'; frame-ancestors 'none'";
    }

    map $request_uri $docs_spec_upstream {
        default "";
        ~^/api-docs/specs/auth\.json$ http://auth-service:8000/openapi.json;
        ~^/api-docs/specs/destination\.json$ http://destination-service:8000/openapi.json;
        ~^/api-docs/specs/interaction\.json$ http://interaction-service:8000/openapi.json;
        ~^/api-docs/specs/admin\.json$ http://admin-service:8000/openapi.json;
        ~^/api-docs/specs/analytics\.json$ http://analytics-service:8000/openapi.json;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Basic log format with upstream timing for debugging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time '
                    'ua="$upstream_addr" us="$upstream_status"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Upstream pools
    upstream auth_service_upstream {
        server auth-service:8000;
        keepalive 32;
    }

    upstream destination_service_upstream {
        server destination-service:8000;
        keepalive 64;
    }

    upstream interaction_service_upstream {
        server interaction-service:8000;
        keepalive 32;
    }

    upstream admin_service_upstream {
        server admin-service:8000;
        keepalive 16;
    }

    upstream analytics_service_upstream {
        server analytics-service:8000;
        keepalive 16;
    }

    server {
        listen 80;
        charset utf-8;
        client_max_body_size 1m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy $content_security_policy always;

        # Common proxy headers and timeouts
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Optional buffering defaults (safe for JSON APIs)
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;

        location = /api-docs {
            return 308 /api-docs/;
        }

        location ^~ /api-docs/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /api-docs/index.html;
        }

        location ^~ /api-docs/specs/ {
            proxy_pass $docs_spec_upstream;
        }

        location ^~ /api-docs/swagger/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /api-docs/index.html;
        }

        location ^~ /api-docs/redoc/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /api-docs/index.html;
        }

        # Health and root checks
        location = / {
            default_type text/plain;
            return 200 "API Gateway is running\n";
        }

        location = /health {
            proxy_pass http://destination_service_upstream/health;
        }

        # Normalize trailing slash for top-level API prefixes
        location = /api/v1/auth/         { return 308 /api/v1/auth; }
        location = /api/v1/public/       { return 308 /api/v1/public; }
        location = /api/v1/destinations/ { return 308 /api/v1/destinations; }
        location = /api/v1/me/           { return 308 /api/v1/me; }
        location = /api/v1/admin/        { return 308 /api/v1/admin; }
        location = /api/v1/analytics/    { return 308 /api/v1/analytics; }

        # Route groups
        location /api/v1/auth {
            proxy_pass http://auth_service_upstream;
        }

        location /api/v1/public {
            proxy_pass http://destination_service_upstream;
        }

        location /api/v1/destinations {
            proxy_pass http://destination_service_upstream;
        }

        location /api/v1/me {
            proxy_pass http://interaction_service_upstream;
        }

        location /api/v1/admin {
            proxy_pass http://admin_service_upstream;
        }

        location /api/v1/analytics {
            proxy_pass http://analytics_service_upstream;
        }

        # Fallback: API gateway only
        location / {
            default_type text/plain;
            return 404 "Not Found\n";
        }
    }
}