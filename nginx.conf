worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Pha C: rate-limit gateway (đồng bộ ngưỡng backend: IP 120/phút)
    limit_req_zone $binary_remote_addr zone=api_ip:10m rate=120r/m;
    limit_req_status 429;

    # Giữ port ngoài (8080) khi forward vào Apache:80 — Laravel dùng để sinh route().
    # $server_port trong container luôn là 80 nên phải trích port từ Host header.
    map $http_host $external_port {
        ~:(?<p>\d+)$ $p;
        default 80;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # MVP boundaries (B1..B7 rút gọn monolith):
    # B1 browser -> frontend / ; B2 frontend -> backend /api/v1/* (qua gateway)
    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:80;
        keepalive 32;
    }

    server {
        listen 80;
        charset utf-8;
        client_max_body_size 1m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $external_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Gateway self-check (không chiếm `/` của frontend B1)
        location = /gateway-health {
            default_type text/plain;
            return 200 "API Gateway is running (MVP monolith)\n";
        }

        # B2: backend API (monolith app.main:app)
        location /api/v1/ {
            limit_req zone=api_ip burst=20 nodelay;
            proxy_pass http://backend_upstream;
        }

        location = /health {
            proxy_pass http://backend_upstream/health;
        }

        # Pha C: observability backend (mount ngoài /api/v1)
        location = /metrics {
            proxy_pass http://backend_upstream/metrics;
        }

        location = /ready {
            proxy_pass http://backend_upstream/ready;
        }

        # B1: frontend Blade
        location / {
            proxy_pass http://frontend_upstream;
        }
    }
}
