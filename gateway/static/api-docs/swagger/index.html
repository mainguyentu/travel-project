<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel API Swagger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f8fafc;
    }
    #swagger-ui {
      min-height: 100vh;
    }
    .topbar {
      display: none;
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    const serviceMap = {
      auth: '/api-docs/specs/auth.json',
      destination: '/api-docs/specs/destination.json',
      interaction: '/api-docs/specs/interaction.json',
      admin: '/api-docs/specs/admin.json',
      analytics: '/api-docs/specs/analytics.json',
    };

    const path = window.location.pathname.replace(/\/+$/, '');
    const service = path.split('/').pop() || 'auth';
    const specUrl = serviceMap[service] || serviceMap.auth;

    window.ui = SwaggerUIBundle({
      url: specUrl,
      dom_id: '#swagger-ui',
      deepLinking: true,
      displayRequestDuration: true,
      docExpansion: 'list',
      filter: true,
      showExtensions: true,
      showCommonExtensions: true,
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIStandalonePreset,
      ],
      layout: 'StandaloneLayout',
    });
  </script>
</body>
</html>
