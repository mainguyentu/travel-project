services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: travel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/travel
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-32chars!!}
      JWT_ISSUER: alats-travel
      CORS_ORIGINS: '["http://127.0.0.1","http://localhost","http://127.0.0.1:8080","http://localhost:8080"]'
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      ACTIVITY_RECOMMENDATION_ENABLED: "true"
      ES_URL: http://elasticsearch:9200
      ES_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: python scripts/worker.py
    volumes:
      - ./backend/scripts:/srv/app/scripts:ro
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/travel
      REDIS_URL: redis://redis:6379/0
      ES_URL: http://elasticsearch:9200
      ES_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      APP_NAME: "Alats Travel DaNang"
      APP_KEY: "base64:fhcb1MWnN5UPYfz63AL8Z67++LXxdZTJPfhDShWlRfE="
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://127.0.0.1:8080"
      API_BASE_URL: "http://backend:8000/api/v1"
      SESSION_DRIVER: "file"
      CACHE_STORE: "file"
      API_CACHE_ENABLED: "true"
    depends_on:
      - backend
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  esdata:
