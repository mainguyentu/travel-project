services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: travel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  migrate:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/travel
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me
      JWT_ISSUER: alats-travel
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-lc", "alembic upgrade head && python scripts/seed.py"]

  auth-service:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/travel
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me
      JWT_ISSUER: alats-travel
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: ["uvicorn", "app.apps.auth_service:app", "--host", "0.0.0.0", "--port", "8000"]

  destination-service:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/travel
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me
      JWT_ISSUER: alats-travel
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: ["uvicorn", "app.apps.destination_service:app", "--host", "0.0.0.0", "--port", "8000"]

  interaction-service:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/travel
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me
      JWT_ISSUER: alats-travel
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: ["uvicorn", "app.apps.interaction_service:app", "--host", "0.0.0.0", "--port", "8000"]

  admin-service:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/travel
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me
      JWT_ISSUER: alats-travel
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: ["uvicorn", "app.apps.admin_service:app", "--host", "0.0.0.0", "--port", "8000"]

  api-gateway:
    image: nginx:1.27
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - destination-service
      - interaction-service
      - admin-service

volumes:
  pgdata:
