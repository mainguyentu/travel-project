services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: travel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/travel
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ISSUER: alats-travel
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-lc", "alembic upgrade head && python scripts/seed.py"]
    restart: "no"

  auth-service:
    build:
      context: ./backend
    environment: *backend_env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.apps.auth_service:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  destination-service:
    build:
      context: ./backend
    environment: *backend_env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.apps.destination_service:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  interaction-service:
    build:
      context: ./backend
    environment: *backend_env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.apps.interaction_service:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  admin-service:
    build:
      context: ./backend
    environment: *backend_env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.apps.admin_service:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  api-gateway:
    image: nginx:1.27
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - destination-service
      - interaction-service
      - admin-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
